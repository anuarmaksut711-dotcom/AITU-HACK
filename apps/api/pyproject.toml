[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aimeet-api"
version = "0.1.0"
description = "AI Meet workspace API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<0.5",
  "faster-whisper==1.2.1",
  "PyJWT>=2.10,<3",
  "webrtcvad-wheels>=2.0.14,<3",
  "sherpa-onnx==1.13.8",
  "onnxruntime>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aimeet_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
