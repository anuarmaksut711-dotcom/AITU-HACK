worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    etag off;
    sub_filter_once off;
    sub_filter '__AIMEET_CSP_NONCE__' '$request_id';
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://$http_host wss://$http_host; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    location = /healthz { return 200 'ok'; }
    location /livekit/ {
      proxy_pass http://livekit:7880/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
    location /api/v1/live/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
    location = /api/v1/meetings/audio {
      client_max_body_size 100m;
      client_body_timeout 120s;
      proxy_request_buffering off;
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 600s;
      proxy_buffering on;
    }
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
